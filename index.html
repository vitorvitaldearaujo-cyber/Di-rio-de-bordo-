<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Diário de Bordo</title>
    <style>
        :root {
            --bg-color: #f4f6f9;
            --card-bg: #ffffff;
            --primary: #1a365d;
            --border: #cbd5e0;
            --text: #2d3748;
        }

        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background-color: var(--bg-color);
            color: var(--text);
            margin: 0;
            padding: 20px;
        }

        .container {
            max-width: 1100px;
            margin: 0 auto;
        }

        header {
            background-color: var(--primary);
            color: white;
            padding: 15px 20px;
            border-radius: 8px;
            margin-bottom: 20px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            flex-wrap: wrap;
            gap: 10px;
        }

        h1 { margin: 0; font-size: 1.5rem; }
        .clock { font-size: 0.95rem; opacity: 0.9; }

        .btn-notify {
            background: #d69e2e;
            color: white;
            border: none;
            padding: 8px 14px;
            border-radius: 4px;
            cursor: pointer;
            font-weight: bold;
            font-size: 0.85rem;
        }
        .btn-notify:hover { background: #b7791f; }

        .tabs {
            display: flex;
            gap: 10px;
            margin-bottom: 20px;
        }

        .tab-btn {
            background: #e2e8f0;
            border: none;
            padding: 10px 20px;
            border-radius: 6px;
            cursor: pointer;
            font-weight: bold;
            color: var(--text);
        }

        .tab-btn.active {
            background: var(--primary);
            color: white;
        }

        .tab-content { display: none; }
        .tab-content.active { display: block; }

        .section-title {
            font-size: 1.1rem;
            font-weight: bold;
            margin: 20px 0 10px 0;
            padding-bottom: 5px;
            border-bottom: 2px solid var(--primary);
            display: flex;
            align-items: center;
            gap: 8px;
        }

        .task-list {
            display: flex;
            flex-direction: column;
            gap: 12px;
        }

        .task-card {
            background: var(--card-bg);
            border: 1px solid var(--border);
            border-radius: 8px;
            padding: 14px;
            box-shadow: 0 2px 5px rgba(0,0,0,0.04);
            display: flex;
            flex-direction: column;
            gap: 10px;
        }

        .task-header-row {
            display: grid;
            grid-template-columns: 2fr 100px 110px 140px 180px 40px;
            gap: 10px;
            align-items: center;
        }

        .input-title {
            font-weight: bold;
            font-size: 1rem;
            border-left: 3px solid var(--primary);
        }

        input, select, textarea {
            padding: 8px;
            border: 1px solid var(--border);
            border-radius: 4px;
            font-size: 0.9rem;
            width: 100%;
            box-sizing: border-box;
        }

        .details-panel {
            display: none;
            margin-top: 5px;
            padding-top: 10px;
            border-top: 1px dashed var(--border);
            grid-template-columns: 1fr 1fr;
            gap: 10px;
        }

        .details-panel.active { display: grid; }

        .btn-expand {
            background: #edf2f7;
            border: 1px solid var(--border);
            border-radius: 4px;
            cursor: pointer;
            padding: 8px;
            font-weight: bold;
        }

        .btn-add {
            background: #2b6cb0;
            color: white;
            border: none;
            padding: 12px 20px;
            border-radius: 6px;
            cursor: pointer;
            margin-top: 15px;
            font-weight: bold;
            font-size: 0.95rem;
        }

        .modal-overlay {
            display: none;
            position: fixed;
            top: 0; left: 0; width: 100%; height: 100%;
            background: rgba(0,0,0,0.5);
            justify-content: center;
            align-items: center;
            z-index: 1000;
        }

        .modal-overlay.active { display: flex; }

        .modal-box {
            background: white;
            padding: 20px 30px;
            border-radius: 8px;
            text-align: center;
            box-shadow: 0 4px 10px rgba(0,0,0,0.15);
        }

        .modal-buttons {
            display: flex;
            justify-content: center;
            gap: 15px;
            margin-top: 15px;
        }

        .btn-sim { background: #38a169; color: white; border: none; padding: 8px 20px; border-radius: 4px; cursor: pointer; font-weight: bold; }
        .btn-nao { background: #e53e3e; color: white; border: none; padding: 8px 20px; border-radius: 4px; cursor: pointer; font-weight: bold; }

        /* Cores de Status */
        select.status-concluido { background-color: #c6f6d5; color: #22543d; font-weight: bold; }
        select.status-parcial { background-color: #feebc8; color: #744210; font-weight: bold; }
        select.status-andamento { background-color: #ebf8ff; color: #2b6cb0; font-weight: bold; }
        select.status-nao-concluido { background-color: #fed7d7; color: #742a2a; font-weight: bold; }
        select.status-cancelado { background-color: #edf2f7; color: #4a5568; font-weight: bold; }

        @media (max-width: 850px) {
            .task-header-row { grid-template-columns: 1fr; }
            .details-panel { grid-template-columns: 1fr; }
        }
    </style>
</head>
<body>

<div class="container">
    <header>
        <div>
            <h1>DIÁRIO DE BORDO</h1>
            <div class="clock" id="current-datetime">--/--/---- --:--:--</div>
        </div>
        <button class="btn-notify" onclick="requestNotificationPermission()">🔔 Ativar Notificações no Celular</button>
    </header>

    <div class="tabs">
        <button class="tab-btn active" onclick="switchTab('painel')">Painel do Dia / Pendências</button>
        <button class="tab-btn" onclick="switchTab('historico')">Todos os Registros</button>
    </div>

    <!-- ABA 1: PAINEL PRINCIPAL -->
    <div id="tab-painel" class="tab-content active">
        <div class="section-title">
            <span>⚠️</span> Pendências (Em andamento, Parcialmente concluído, Não concluído)
        </div>
        <div id="pendencias-list" class="task-list"></div>

        <div class="section-title">
            <span>📅</span> Agenda do Dia
        </div>
        <div id="agenda-list" class="task-list"></div>

        <button class="btn-add" onclick="addNewTask()">+ Nova Atividade</button>
    </div>

    <!-- ABA 2: TODOS OS REGISTROS -->
    <div id="tab-historico" class="tab-content">
        <div class="section-title">
            <span>📚</span> Histórico Geral de Tarefas Concluídas e Canceladas
        </div>
        <div id="historico-list" class="task-list"></div>
    </div>
</div>

<!-- MODAL DE CONFIRMAÇÃO -->
<div class="modal-overlay" id="confirm-modal">
    <div class="modal-box">
        <p id="modal-text">Você tem certeza?</p>
        <div class="modal-buttons">
            <button class="btn-sim" onclick="confirmStatusChange(true)">Sim</button>
            <button class="btn-nao" onclick="confirmStatusChange(false)">Não</button>
        </div>
    </div>
</div>

<script>
    // Inicia com um cartão limpo de exemplo
    let tasks = [
        { 
            id: 1, 
            title: "", 
            desc: "", 
            time: "", 
            priority: "Média", 
            deadline: "", 
            status: "Em andamento", 
            resources: "", 
            obs: "" 
        }
    ];

    let pendingStatusChange = null;
    const notificationTimes = ["08:00", "12:00", "15:00", "18:00"];
    let triggeredToday = {};

    function updateDateTime() {
        const now = new Date();
        const currentTimeStr = now.toLocaleTimeString('pt-BR');
        document.getElementById('current-datetime').innerText = now.toLocaleDateString('pt-BR') + ' ' + currentTimeStr;
        checkScheduledNotifications(now);
    }
    setInterval(updateDateTime, 1000);
    updateDateTime();

    function requestNotificationPermission() {
        if ("Notification" in window) {
            Notification.requestPermission().then(permission => {
                if (permission === "granted") {
                    alert("Notificações ativadas! Alertas diários definidos para 08:00, 12:00, 15:00 e 18:00.");
                    sendSummaryNotification();
                } else {
                    alert("Permissão para notificações foi negada.");
                }
            });
        } else {
            alert("Este navegador não suporta notificações.");
        }
    }

    function sendSummaryNotification() {
        if ("Notification" in window && Notification.permission === "granted") {
            const pendencias = tasks.filter(t => isPending(t.status) && t.title.trim() !== "");
            
            if (pendencias.length === 0) {
                new Notification("📋 Diário de Bordo", {
                    body: "Nenhuma pendência cadastrada no momento.",
                    icon: "https://cdn-icons-png.flaticon.com/512/190/190411.png"
                });
            } else {
                const titulos = pendencias.slice(0, 3).map(t => "• " + t.title).join("\n");
                const restantes = pendencias.length > 3 ? `\n...e mais ${pendencias.length - 3} pendência(s).` : "";
                
                new Notification(`📋 Diário de Bordo: ${pendencias.length} Pendência(s)`, {
                    body: `${titulos}${restantes}`,
                    icon: "https://cdn-icons-png.flaticon.com/512/190/190411.png"
                });
            }
        }
    }

    function checkScheduledNotifications(now) {
        const hours = String(now.getHours()).padStart(2, '0');
        const minutes = String(now.getMinutes()).padStart(2, '0');
        const currentTime = `${hours}:${minutes}`;

        if (notificationTimes.includes(currentTime) && !triggeredToday[currentTime]) {
            sendSummaryNotification();
            triggeredToday[currentTime] = true;
        }

        if (currentTime === "00:00") {
            triggeredToday = {};
        }
    }

    function switchTab(tabName) {
        document.querySelectorAll('.tab-btn').forEach(btn => btn.classList.remove('active'));
        document.querySelectorAll('.tab-content').forEach(content => content.classList.remove('active'));

        if(tabName === 'painel') {
            document.querySelectorAll('.tab-btn')[0].classList.add('active');
            document.getElementById('tab-painel').classList.add('active');
        } else {
            document.querySelectorAll('.tab-btn')[1].classList.add('active');
            document.getElementById('tab-historico').classList.add('active');
        }
        renderAll();
    }

    function isPending(status) {
        return ['Em andamento', 'Parcialmente concluído', 'Não concluído'].includes(status);
    }

    function handleStatusChange(selectElement, taskId) {
        const newStatus = selectElement.value;
        const task = tasks.find(t => t.id === taskId);

        if (newStatus === 'Concluído' || newStatus === 'Cancelado') {
            pendingStatusChange = { taskId, newStatus, selectElement, oldStatus: task.status };
            document.getElementById('confirm-modal').classList.add('active');
        } else {
            task.status = newStatus;
            renderAll();
        }
    }

    function confirmStatusChange(confirmed) {
        document.getElementById('confirm-modal').classList.remove('active');
        if (!pendingStatusChange) return;

        const { taskId, newStatus, selectElement, oldStatus } = pendingStatusChange;
        const task = tasks.find(t => t.id === taskId);

        if (confirmed) {
            task.status = newStatus;
            renderAll();
        } else {
            selectElement.value = oldStatus;
            updateStatusColor(selectElement);
        }
        pendingStatusChange = null;
    }

    function updateStatusColor(selectElement) {
        selectElement.className = 'status-' + getStatusClass(selectElement.value);
    }

    function toggleDetails(id) {
        document.getElementById(`details-${id}`).classList.toggle('active');
    }

    function addNewTask() {
        tasks.push({
            id: Date.now(),
            title: "",
            desc: "",
            time: "",
            priority: "Média",
            deadline: "",
            status: "Em andamento",
            resources: "",
            obs: ""
        });
        renderAll();
    }

    function renderCard(task) {
        return `
            <div class="task-card" id="task-${task.id}">
                <div class="task-header-row">
                    <input type="text" class="input-title" value="${task.title}" placeholder="Ex: Título da Tarefa..." onchange="tasks.find(t=>t.id===${task.id}).title=this.value">
                    <input type="time" value="${task.time}" onchange="tasks.find(t=>t.id===${task.id}).time=this.value">
                    <select onchange="tasks.find(t=>t.id===${task.id}).priority=this.value">
                        <option value="Alta" ${task.priority === 'Alta' ? 'selected' : ''}>🔴 Alta</option>
                        <option value="Média" ${task.priority === 'Média' ? 'selected' : ''}>🟡 Média</option>
                        <option value="Baixa" ${task.priority === 'Baixa' ? 'selected' : ''}>🟢 Baixa</option>
                    </select>
                    <input type="datetime-local" value="${task.deadline}" onchange="tasks.find(t=>t.id===${task.id}).deadline=this.value">
                    <select class="status-${getStatusClass(task.status)}" onchange="handleStatusChange(this, ${task.id})">
                        <option value="Concluído" ${task.status === 'Concluído' ? 'selected' : ''}>Concluído</option>
                        <option value="Parcialmente concluído" ${task.status === 'Parcialmente concluído' ? 'selected' : ''}>Parcialmente concluído</option>
                        <option value="Em andamento" ${task.status === 'Em andamento' ? 'selected' : ''}>Em andamento</option>
                        <option value="Não concluído" ${task.status === 'Não concluído' ? 'selected' : ''}>Não concluído</option>
                        <option value="Cancelado" ${task.status === 'Cancelado' ? 'selected' : ''}>Cancelado</option>
                    </select>
                    <button class="btn-expand" onclick="toggleDetails(${task.id})" title="Recursos e Observações">⚙️</button>
                </div>

                <div class="task-desc-row">
                    <textarea rows="2" placeholder="Ex: Digite a descrição detalhada da atividade ou pendência aqui..." onchange="tasks.find(t=>t.id===${task.id}).desc=this.value">${task.desc || ''}</textarea>
                </div>

                <div class="details-panel" id="details-${task.id}">
                    <div>
                        <label><strong>Recursos Necessários:</strong></label>
                        <textarea rows="2" placeholder="Ex: Ferramentas, documentos, equipamentos, contatos..." onchange="tasks.find(t=>t.id===${task.id}).resources=this.value">${task.resources || ''}</textarea>
                    </div>
                    <div>
                        <label><strong>Observações:</strong></label>
                        <textarea rows="2" placeholder="Ex: Anotações do processo, imprevistos ou históricos..." onchange="tasks.find(t=>t.id===${task.id}).obs=this.value">${task.obs || ''}</textarea>
                    </div>
                </div>
            </div>
        `;
    }

    function getStatusClass(status) {
        if (status === 'Concluído') return 'concluido';
        if (status === 'Parcialmente concluído') return 'parcial';
        if (status === 'Em andamento') return 'andamento';
        if (status === 'Não concluído') return 'nao-concluido';
        if (status === 'Cancelado') return 'cancelado';
        return '';
    }

    function renderAll() {
        const pendenciasContainer = document.getElementById('pendencias-list');
        const agendaContainer = document.getElementById('agenda-list');
        const historicoContainer = document.getElementById('historico-list');

        pendenciasContainer.innerHTML = '';
        agendaContainer.innerHTML = '';
        historicoContainer.innerHTML = '';

        tasks.forEach(task => {
            if (isPending(task.status)) {
                pendenciasContainer.innerHTML += renderCard(task);
            } else {
                historicoContainer.innerHTML += renderCard(task);
            }
        });
    }

    renderAll();
</script>

</body>
</html>
